<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <meta name="color-scheme" content="dark">
  <title>Codex Remote Web — Safari 연결</title>
  <link rel="stylesheet" href="/remote-login.css">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script src="/remote-login.js" type="module"></script>
</head>
<body>
  <main class="login">
    <div class="mark">✳ <span>Codex <span class="muted">Remote</span></span></div>
    <h1>Safari 연결</h1>
    <p>아이패드 앱 설치 없이 연결할 수 있어요. PC에서 발급한 일회용 코드를 입력하세요.</p>
    <form id="pair-form">
      <label for="code">일회용 연결 코드</label>
      <input id="code" type="text" required autocapitalize="characters" autocomplete="off"
        spellcheck="false" placeholder="XXXXXX-XXXXXX-XXXXXX-XXXXXX" maxlength="27">
      <button id="pair-button" type="submit">이 Safari 연결하기 →</button>
    </form>
    <p id="error" role="alert" aria-live="polite"></p>
    <div class="help">
      <strong>PC에서 코드 확인</strong>
      <code>npm.cmd run remote:code</code>
      <span>코드는 10분 동안 한 번만 사용할 수 있어요. 코드 자체를 공유하지 마세요.</span>
    </div>
    <footer>비공식 개인용 클라이언트 · 본인이 승인한 브라우저만 작업에 접근할 수 있습니다.</footer>
  </main>
</body>
</html>
